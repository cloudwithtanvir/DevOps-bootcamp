# Production is built from master; the public preview is built from dev.
name: Build and deploy Jekyll site

on:
  push:
    branches: ["master", "dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Keep both source trees isolated. Checking one branch out inside the
      # other branch's Jekyll source can cause Jekyll to process duplicate
      # pages and publish the wrong index.html.
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: master
          path: production-source

      - name: Checkout dev preview source
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-source

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build production site from master
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./production-source
          destination: ./_site

      - name: Set preview base URL
        run: sed -i 's|baseurl: "/DevOps-bootcamp"|baseurl: "/DevOps-bootcamp/preview"|' dev-source/_config.yml

      - name: Build dev preview under /preview/
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./dev-source
          destination: ./_site/preview

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
