# Production is built from master; the public preview is built from dev.
name: Build and deploy Jekyll site

on:
  push:
    branches: ["master", "dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4

      - name: Checkout production source for dev deployment
        if: github.ref == 'refs/heads/dev'
        uses: actions/checkout@v4
        with:
          ref: master
          path: production-source

      - name: Checkout dev source for production deployment
        if: github.ref == 'refs/heads/master'
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-source

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build production site from master (dev run)
        if: github.ref == 'refs/heads/dev'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./production-source
          destination: ./_site

      - name: Build production site (master run)
        if: github.ref == 'refs/heads/master'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Set preview base URL
        run: |
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            sed -i 's|baseurl: "/DevOps-bootcamp"|baseurl: "/DevOps-bootcamp/preview"|' _config.yml
          else
            sed -i 's|baseurl: "/DevOps-bootcamp"|baseurl: "/DevOps-bootcamp/preview"|' dev-source/_config.yml
          fi

      - name: Build dev preview under /preview/ (dev run)
        if: github.ref == 'refs/heads/dev'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site/preview

      - name: Build dev preview under /preview/ (master run)
        if: github.ref == 'refs/heads/master'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./dev-source
          destination: ./_site/preview

      - name: Upload dev preview artifact
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: dev-site-preview
          path: ./_site/preview
          retention-days: 7

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
