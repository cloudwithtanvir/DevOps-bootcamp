<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101916">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
          <span class="brand-mark" aria-hidden="true">D</span>
          <span>DEVOPS <span class="brand-light">FIELDNOTES</span></span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}#curriculum">Curriculum</a>
          <a href="{{ '/ROADMAP.html' | relative_url }}">Roadmap</a>
          <a href="{{ '/HOW-TO-SUBMIT.html' | relative_url }}">How to submit</a>
          <a class="nav-github" href="https://github.com/cloudwithtanvir/DevOps-bootcamp">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>

    <main id="main">{{ content }}</main>

    <footer class="site-footer">
      <div class="footer-inner">
        <a class="brand footer-brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">D</span><span>DEVOPS <span class="brand-light">FIELDNOTES</span></span></a>
        <p>Free, hands-on learning. Built by <a href="https://github.com/cloudwithtanvir">Tanvir Ahmed</a>.</p>
        <a href="https://github.com/cloudwithtanvir/DevOps-bootcamp">View the source <span aria-hidden="true">↗</span></a>
      </div>
    </footer>
  </body>
</html>
